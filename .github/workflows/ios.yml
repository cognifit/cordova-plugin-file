name: iOS warning checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  native:
    name: Native checks (Cordova iOS ${{ matrix.cordova }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        cordova: ['6.2.0', '7.1.1', '8.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Install released Cordova headers
        env:
          CORDOVA_VERSION: ${{ matrix.cordova }}
        run: |
          npm install --prefix "$RUNNER_TEMP/cordova" --ignore-scripts --no-audit --no-fund "cordova-ios@$CORDOVA_VERSION"
          cordova_root="$RUNNER_TEMP/cordova/node_modules/cordova-ios"
          if [ -d "$cordova_root/CordovaLib/include" ]; then
            echo "CORDOVA_HEADERS=$cordova_root/CordovaLib/include" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/cordova-headers"
            ln -s "$cordova_root/CordovaLib/Classes/Public" "$RUNNER_TEMP/cordova-headers/Cordova"
            echo "CORDOVA_HEADERS=$RUNNER_TEMP/cordova-headers" >> "$GITHUB_ENV"
          fi
      - name: Compile iOS 11, 17 and 26 with warnings as errors
        run: sh tests/ios-warning-compile.sh
      - name: Run native behavior regressions
        run: python3 tests/ios-warning-regressions.py
